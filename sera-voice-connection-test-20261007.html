<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세라 음성 연결 안전 테스트</title>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f7f3ea;margin:0;padding:24px;color:#173c32}
.card{max-width:680px;margin:40px auto;background:white;border-radius:24px;padding:28px;box-shadow:0 10px 35px #0001}
h1{font-size:25px}.status{padding:16px;border-radius:14px;background:#eef8f2;margin:18px 0;font-weight:700}
button{width:100%;padding:16px;border:0;border-radius:14px;background:#1d6b51;color:white;font-size:18px;font-weight:800;margin-top:10px}
pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:12px;font-size:13px}
small{display:block;margin-top:16px;color:#667}
</style></head><body><div class="card">
<h1>AI 피부 척척박사 세라 · 음성 서버 연결 테스트</h1>
<p>운영 v89와 별개인 안전 테스트 화면입니다. 먼저 서버 연결을 확인한 뒤 마이크 권한을 확인합니다.</p>
<div id="status" class="status">아직 테스트하지 않았습니다.</div>
<button id="test">1. 세라 서버 연결 확인</button>
<button id="mic">2. 마이크 권한 확인</button>\n<button id="talk">3. 세라와 실제 음성 대화 시작</button>\n<button id="stop" style="background:#65736e">통화 종료</button>
<pre id="log"></pre>
<small>이 페이지는 운영 index.html을 변경하지 않습니다.</small>
</div>
<script>
const BASE='https://maiim-ai-backend-production.up.railway.app';
const st=document.getElementById('status'),log=document.getElementById('log');
function add(x){log.textContent+=x+'\n'}
document.getElementById('test').onclick=async()=>{
 st.textContent='서버 확인 중...'; log.textContent='';
 try{
  const r=await fetch(BASE+'/health',{cache:'no-store'});
  add('GET /health → HTTP '+r.status);
  const t=await r.text(); add(t.slice(0,500));
  st.textContent=r.ok?'✅ 세라 서버 연결 정상':'⚠️ 서버 응답 확인 필요';
 }catch(e){st.textContent='❌ 세라 서버 연결 실패';add(String(e))}
};
document.getElementById('mic').onclick=async()=>{
 try{
  const s=await navigator.mediaDevices.getUserMedia({audio:true});
  s.getTracks().forEach(t=>t.stop());
  st.textContent='✅ HTTPS 마이크 권한 정상';
  add('마이크 권한: 허용됨');
 }catch(e){st.textContent='❌ 마이크 권한 확인 필요';add(e.name+': '+e.message)}
};

let pc=null,localStream=null,audioEl=null,dc=null;
document.getElementById('talk').onclick=async()=>{
 try{if(dc){try{dc.close();}catch(e){} dc=null;}
if(pc){try{pc.close();}catch(e){} pc=null;}
if(localStream){try{localStream.getTracks().forEach(t=>t.stop());}catch(e){} localStream=null;}
if(audioEl){try{audioEl.pause();audioEl.srcObject=null;audioEl.remove();}catch(e){} audioEl=null;}
  st.textContent='세라 실시간 음성 연결 중...'; add('실시간 연결 시작');
  localStream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc=new RTCPeerConnection();
  audioEl=document.createElement('audio'); audioEl.autoplay=true; document.body.appendChild(audioEl);
  pc.ontrack=e=>{audioEl.srcObject=e.streams[0]; add('세라 원격 음성 트랙 연결됨');};
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 dc=pc.createDataChannel('oai-events');
  dc.onopen=()=>{
    add('실시간 데이터 채널 연결됨');
    try{dc.send(JSON.stringify({type:'response.create',response:{instructions:'한국어로 따뜻하게 인사하고, 저는 AI 피부 척척박사 세라입니다. 무엇이 가장 궁금하신가요? 라고 짧게 말해 주세요.'}}))}catch(e){}
  };
  dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type)add('event: '+x.type)}catch(_){}};
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await new Promise(resolve=>{
    if(pc.iceGatheringState==='complete')return resolve();
    const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);resolve()}};
    pc.addEventListener('icegatheringstatechange',f); setTimeout(resolve,2500);
  });
  const r=await fetch(BASE+'/api/realtime',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sdp:pc.localDescription.sdp,preferredVoice:'marin',skinContext:{test:true,source:'sera-voice-connection-test'}})
  });
  add('POST /api/realtime → HTTP '+r.status);
  const answer=await r.text();
  if(!r.ok)throw new Error(answer.slice(0,500));
  await pc.setRemoteDescription({type:'answer',sdp:answer});
  st.textContent='✅ 세라 실시간 음성 연결 완료 · 세라에게 말씀해 보세요';
  document.getElementById('talk').disabled=true;
document.getElementById('stop').disabled=false;
  
 }catch(e){
  st.textContent='❌ 세라 실시간 음성 연결 실패';
  add((e&&e.message)||String(e));
 }
};
document.getElementById('stop').onclick=()=>{
  try{
    if(dc && dc.readyState !== 'closed') dc.close();
  }catch(e){}

  try{
    if(pc){
      pc.getSenders().forEach(sender=>{
        try{ if(sender.track) sender.track.stop(); }catch(e){}
      });
      pc.close();
    }
  }catch(e){}
  pc=null;

  try{
    if(localStream){
      localStream.getTracks().forEach(track=>track.stop());
    }
  }catch(e){}
  localStream=null;

  try{
    if(audioEl){
      audioEl.pause();
      audioEl.srcObject=null;
      audioEl.remove();
    }
  }catch(e){}
  audioEl=null;

  document.getElementById('talk').disabled=false;
  document.getElementById('stop').disabled=true;

  st.textContent='✅ 통화를 정상적으로 종료했습니다.';
  add('통화 종료 · 마이크와 세라 음성 연결 해제 완료');
};
</script></body></html>
